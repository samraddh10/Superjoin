# Serves the built interface and proxies the API, so the browser sees one origin.
#
# The same arrangement as the Vite dev server's proxy, for the same reason: with a single
# origin there is no CORS configuration in the system at all, and therefore none that
# could be correct in development and permissive in production.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A single-page app with no router of its own, but a reload on any path should still
    # reach the shell rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames, so they can be cached indefinitely. index.html is not
    # hashed and is deliberately excluded above.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every prefix the API owns. Listed explicitly rather than proxying everything that
    # is not a file, so a typo in a fetch path fails visibly here instead of being
    # forwarded and 404ing somewhere less obvious.
    location ~ ^/(collections|documents|facts|relationships|runs|settings|health|ready) {
        # Re-resolve the API's address per request rather than once at startup.
        #
        # nginx resolves a literal upstream name when it loads its configuration and then
        # caches that address for the life of the process. Recreating the api container
        # gives it a new address on the Compose network, and nginx keeps proxying to the
        # old one — every request answered 502 while the API itself was healthy and
        # serving on port 3000. Restarting web fixed it, which is a fix nobody should have
        # to know about.
        #
        # Naming the upstream in a variable defers resolution to request time, and the
        # resolver is Docker's embedded DNS at the fixed address every container gets.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api http://api:3000;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads are bounded by MAX_UPLOAD_MB on the API side; nginx defaults to 1MB and
        # would reject a real PDF before the API ever saw it. Left generous here so the
        # API's own limit is the one that applies and reports the reason.
        client_max_body_size 100m;

        # A large document can take a while to accept; the API answers 202 only once the
        # bytes are stored and the job is enqueued.
        proxy_read_timeout 300s;
    }
}
