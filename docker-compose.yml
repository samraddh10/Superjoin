# Local execution for the services the plan names: api, worker, postgres and, later, web.
#
# web is added in Phase 7, when it has something to render. pg-boss creates and owns its
# own schema in this same database, so no separate queue service is needed.
#
# The api and worker share one database and one PDF volume, which is what plan section
# 1.3's exit condition requires them to demonstrate.

services:
  postgres:
    # pgvector is required by plan section 6.1 for candidate retrieval. Taking the
    # extension as part of the image avoids a build step in the migration path.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: superjoin
      POSTGRES_PASSWORD: superjoin
      POSTGRES_DB: superjoin
    ports:
      # Exposed so migrations and tests can run on the host against the same database
      # the containers use.
      #
      # 55432 rather than 5432 deliberately. The default port collides with any other
      # Postgres already running on a developer machine, and a collision there is not
      # merely inconvenient: DATABASE_URL would still connect, to the wrong database,
      # and migrations would be applied to someone else's schema. A distinctive port
      # fails loudly instead. Containers reach each other on the internal 5432.
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Services that depend on postgres must wait for readiness, not just for the
      # container to exist; the server restarts once during first-run initialisation.
      test: ['CMD-SHELL', 'pg_isready -U superjoin -d superjoin']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Applies migrations once, then exits. api and worker wait for it to succeed, so
  # neither can start against a schema that does not exist yet.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://superjoin:superjoin@postgres:5432/superjoin
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: api
    environment:
      # Container-to-container, so the internal port and the service name, not 55432.
      DATABASE_URL: postgres://superjoin:superjoin@postgres:5432/superjoin
      STORAGE_DIR: /data/storage
      PORT: 3000
      # Deliberately unset: the API never holds the model key. Only the worker calls
      # Gemini, per the plan's service boundaries.
    ports:
      - '3000:3000'
    volumes:
      - pdf-storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://superjoin:superjoin@postgres:5432/superjoin
      STORAGE_DIR: /data/storage
      # The only service given model access. Absent means saved-output mode.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      # The same volume the api mounts, at the same path.
      - pdf-storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  # Original PDFs and derived parsing artifacts, shared by the api and worker services
  # once they exist. Named here so the volume's lifecycle is visible from the start.
  pdf-storage:
